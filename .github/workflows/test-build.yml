name: Run project build & tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ─── Rust workspace & WASM ────────────────────────────────────

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Check Rust
        run: cargo check --workspace --locked

      - name: Build Rust
        run: cargo build --verbose --workspace --locked

      - name: Test Rust
        run: cargo test --verbose --workspace --locked

      - name: Install wasm-bindgen-cli
        run: |
          WBG_VERSION=$(cargo metadata --format-version=1 --locked --filter-platform wasm32-unknown-unknown | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version' | head -n 1)
          test -n "$WBG_VERSION"
          cargo install wasm-bindgen-cli --version "$WBG_VERSION" --locked

      - name: Build WASM
        run: |
          cargo build -p orb-wasm --target wasm32-unknown-unknown --release --locked
          wasm-bindgen --target web --out-dir web/src/wasm target/wasm32-unknown-unknown/release/orb_wasm.wasm

      # ─── TypeScript (web) ─────────────────────────────────────────

      # Install pnpm (version pinned via the packageManager field) + Node
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node Environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2 # Pinned exact version
          cache: pnpm # Caches the pnpm store based on root pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript tests
        run: pnpm --dir web test

      - name: Build Frontend (production)
        run: pnpm --dir web build
