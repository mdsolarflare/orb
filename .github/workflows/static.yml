# Workflow for building and deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build job (separated from deploy so the artifact is visible in the GitHub Artifacts API
  # before actions/deploy-pages queries it — see actions/deploy-pages#451 — and so failed
  # deploy jobs can be re-run without uploading duplicate "github-pages" artifacts)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ─── Rust workspace & WASM ────────────────────────────────────

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Check Rust
        run: cargo check --workspace --locked

      - name: Build Rust
        run: cargo build --verbose --workspace --locked

      - name: Test Rust
        run: cargo test --verbose --workspace --locked

      - name: Install wasm-bindgen-cli
        run: |
          WBG_VERSION=$(cargo metadata --format-version=1 --locked --filter-platform wasm32-unknown-unknown | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version' | head -n 1)
          test -n "$WBG_VERSION"
          cargo install wasm-bindgen-cli --version "$WBG_VERSION" --locked

      - name: Build WASM
        run: |
          cargo build -p orb-wasm --target wasm32-unknown-unknown --release --locked
          wasm-bindgen --target web --out-dir web/src/wasm target/wasm32-unknown-unknown/release/orb_wasm.wasm

      # ─── TypeScript (web) ─────────────────────────────────────────

      # Install pnpm (version pinned via the packageManager field) + Node
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node Environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2 # Pinned exact version
          cache: pnpm # Caches the pnpm store based on root pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript tests
        run: pnpm --dir web test

      - name: Build Frontend - Includes type checking
        run: pnpm --dir web build

      # ─── GitHub Pages ─────────────────────────────────────────────

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'web/dist'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
